services:
  - type: web
    name: trading-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: |
      alembic -c backend/alembic.ini upgrade head &&
      python -c "
import sys, asyncio
from pathlib import Path
root = Path.cwd()
sys.path.insert(0, str(root))
from backend.scripts.import_stocks_master import import_csv
asyncio.run(import_csv(str(root / 'ind_nifty500list.csv'), 'NIFTY500'))
" || echo "Stocks master import step finished (data may already exist or will be seeded on app start)"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      # Candle history — route to Turso so the indicator scanner reads the same
      # 738-stock tape as local. Without this, Render falls back to Postgres
      # (no candle data) → 256 stocks skipped → only 15 matches instead of 20.
      - key: CANDLE_HISTORY_BACKEND
        value: turso
      - key: TURSO_DATABASE_URL
        value: libsql://tradinghistory-rohithvvs.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false   # Set this secret in the Render dashboard, not here
